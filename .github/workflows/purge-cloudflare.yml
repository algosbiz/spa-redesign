name: Purge Cloudflare cache

# Cloudflare sits in front of spabalimoon.com and keeps what it cached after a
# deploy: images are kept 30 days, so a photo replaced under the same file name
# stays old until it is purged. Vercel reports every deployment to GitHub, so
# when a Production deployment succeeds this drops the whole zone's cache.
# It can also be run by hand from the Actions tab.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_ZONE_ID    the spabalimoon.com zone (Overview -> Zone ID)
#   CLOUDFLARE_API_TOKEN  a token with Zone -> Cache Purge -> Purge only

on:
  deployment_status:
  workflow_dispatch:

jobs:
  purge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      # Vercel reports success as the deployment becomes ready; give the
      # production domain a moment to switch to it, or the edge refills from
      # the previous build.
      - name: Wait for the domain to serve the new build
        if: github.event_name == 'deployment_status'
        run: sleep 30

      - name: Purge everything
        env:
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$ZONE_ID" ] || [ -z "$API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN repository secrets."
            exit 1
          fi
          response=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          # Cloudflare can answer 200 with "success": false, so check the body.
          if ! echo "$response" | jq -e '.success == true' > /dev/null; then
            echo "::error::Cloudflare purge failed: $(echo "$response" | jq -c '.errors')"
            exit 1
          fi
          echo "Cloudflare cache purged for the whole zone."

      - name: Show what the edge serves now
        run: |
          for path in / /images/home/homepage-3.webp; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://spabalimoon.com$path")
            cache=$(curl -sI "https://spabalimoon.com$path" | tr -d '\r' | awk -F': ' 'tolower($1)=="cf-cache-status"{print $2}')
            echo "$path -> HTTP $status, cf-cache-status ${cache:-none}"
          done
