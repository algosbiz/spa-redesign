<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" width="900" height="940" role="img" aria-labelledby="t d">
  <title id="t">Foot reflexology chart</title>
  <desc id="d">The soles of both feet seen from below, divided into five bands: head and neck at the toes, chest at the ball of the foot, upper abdomen and lower abdomen in the arch, and pelvis and lower back at the heel, with points for the main organs.</desc>
  <defs>
    <path id="soleR" d="M 525 280 C 560 260, 650 265, 685 292 C 710 320, 705 400, 690 470 C 678 530, 675 610, 670 680 C 666 770, 645 840, 602 842 C 558 844, 538 790, 540 720 C 542 660, 558 590, 550 520 C 542 450, 512 390, 510 340 C 509 310, 515 288, 525 280 Z"/>
    <path id="soleL" d="M 375 280 C 340 260, 250 265, 215 292 C 190 320, 195 400, 210 470 C 222 530, 225 610, 230 680 C 234 770, 255 840, 298 842 C 342 844, 362 790, 360 720 C 358 660, 342 590, 350 520 C 358 450, 388 390, 390 340 C 391 310, 385 288, 375 280 Z"/>
    <clipPath id="clipSoles"><use href="#soleR"/><use href="#soleL"/></clipPath>
  </defs>
  <style>
    .ttl{font:600 28px Georgia,'Times New Roman',serif;fill:#3a3128}
    .sub{font:15px Helvetica,Arial,sans-serif;fill:#6f685d}
    .band{font:700 12px Helvetica,Arial,sans-serif;letter-spacing:.12em;fill:#8a6a24;text-anchor:middle}
    .line{font:italic 11px Helvetica,Arial,sans-serif;fill:#9a8f7f;text-anchor:middle}
    .lbl{font:14px Helvetica,Arial,sans-serif;fill:#3a3128}
    .l{text-anchor:end}
    .foot{font:700 13px Helvetica,Arial,sans-serif;letter-spacing:.14em;fill:#6f685d;text-anchor:middle}
    .note{font:12px Helvetica,Arial,sans-serif;fill:#9a8f7f;text-anchor:middle}
    .lead{stroke:#a59a88;stroke-width:1}
    .pt{fill:#3a3128}
  </style>
  <rect x="0" y="0" width="900" height="940" rx="24" fill="#fbfaf7"/>
  <text class="ttl" x="40" y="58">Foot reflexology chart</text>
  <text class="sub" x="40" y="86">The soles of both feet, seen from below. The right foot maps the right side of the body.</text>

  <!-- bands, clipped to the soles -->
  <g clip-path="url(#clipSoles)">
    <rect x="150" y="240" width="600" height="165" fill="#f6d9d4"/>
    <rect x="150" y="405" width="600" height="120" fill="#f8e6c4"/>
    <rect x="150" y="525" width="600" height="140" fill="#d9ead3"/>
    <rect x="150" y="665" width="600" height="200" fill="#d4e3f0"/>
  </g>
  <!-- toes: head and neck -->
  <g fill="#e6dbf1" stroke="#6b5a45" stroke-width="2">
    <ellipse cx="535" cy="210" rx="32" ry="46"/><ellipse cx="590" cy="195" rx="20" ry="30"/><ellipse cx="632" cy="205" rx="18" ry="27"/><ellipse cx="667" cy="222" rx="16" ry="23"/><ellipse cx="695" cy="248" rx="14" ry="19"/>
    <ellipse cx="365" cy="210" rx="32" ry="46"/><ellipse cx="310" cy="195" rx="20" ry="30"/><ellipse cx="268" cy="205" rx="18" ry="27"/><ellipse cx="233" cy="222" rx="16" ry="23"/><ellipse cx="205" cy="248" rx="14" ry="19"/>
  </g>
  <use href="#soleR" fill="none" stroke="#6b5a45" stroke-width="2"/>
  <use href="#soleL" fill="none" stroke="#6b5a45" stroke-width="2"/>

  <!-- the four lines across the soles -->
  <g stroke="#a8832f" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="185" y1="275" x2="715" y2="275"/><line x1="185" y1="405" x2="715" y2="405"/><line x1="185" y1="525" x2="715" y2="525"/><line x1="185" y1="665" x2="715" y2="665"/>
  </g>
  <rect x="402" y="263" width="96" height="16" fill="#fbfaf7"/><text class="line" x="450" y="275">shoulder line</text>
  <rect x="396" y="393" width="108" height="16" fill="#fbfaf7"/><text class="line" x="450" y="405">diaphragm line</text>
  <rect x="410" y="513" width="80" height="16" fill="#fbfaf7"/><text class="line" x="450" y="525">waist line</text>
  <rect x="408" y="653" width="84" height="16" fill="#fbfaf7"/><text class="line" x="450" y="665">pelvic line</text>

  <!-- band names, between the feet -->
  <text class="band" x="450" y="205">HEAD</text><text class="band" x="450" y="222">&amp; NECK</text>
  <text class="band" x="450" y="345">CHEST</text>
  <text class="band" x="450" y="462">UPPER</text><text class="band" x="450" y="478">ABDOMEN</text>
  <text class="band" x="450" y="590">LOWER</text><text class="band" x="450" y="606">ABDOMEN</text>
  <text class="band" x="450" y="752">PELVIS &amp;</text><text class="band" x="450" y="768">LOWER BACK</text>

  <!-- spine: along the inner edge of each foot -->
  <g fill="none" stroke="#6b5a45" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round">
    <path d="M 366 272 C 378 300, 384 330, 382 352 C 380 400, 360 470, 343 520 C 335 570, 344 640, 351 700 C 354 760, 348 800, 328 824"/>
    <path d="M 534 272 C 522 300, 516 330, 518 352 C 520 400, 540 470, 557 520 C 565 570, 556 640, 549 700 C 546 760, 552 800, 572 824"/>
  </g>

  <!-- left foot points, labelled on the left -->
  <g>
    <line class="lead" x1="365" y1="198" x2="156" y2="160"/><circle class="pt" cx="365" cy="198" r="4.5"/><text class="lbl l" x="150" y="165">Head &amp; brain</text>
    <line class="lead" x1="363" y1="258" x2="156" y2="222"/><circle class="pt" cx="363" cy="258" r="4.5"/><text class="lbl l" x="150" y="227">Neck</text>
    <line class="lead" x1="350" y1="362" x2="156" y2="330"/><circle class="pt" cx="350" cy="362" r="4.5"/><text class="lbl l" x="150" y="335">Heart</text>
    <line class="lead" x1="300" y1="392" x2="156" y2="380"/><circle class="pt" cx="300" cy="392" r="4.5"/><text class="lbl l" x="150" y="385">Solar plexus</text>
    <line class="lead" x1="330" y1="440" x2="156" y2="425"/><circle class="pt" cx="330" cy="440" r="4.5"/><text class="lbl l" x="150" y="430">Stomach</text>
    <line class="lead" x1="242" y1="458" x2="156" y2="458"/><circle class="pt" cx="242" cy="458" r="4.5"/><text class="lbl l" x="150" y="463">Spleen</text>
    <line class="lead" x1="335" y1="482" x2="156" y2="490"/><circle class="pt" cx="335" cy="482" r="4.5"/><text class="lbl l" x="150" y="495">Pancreas</text>
    <line class="lead" x1="292" y1="512" x2="156" y2="522"/><circle class="pt" cx="292" cy="512" r="4.5"/><text class="lbl l" x="150" y="527">Kidney</text>
    <line class="lead" x1="340" y1="590" x2="156" y2="595"/><circle class="pt" cx="340" cy="590" r="4.5"/><text class="lbl l" x="150" y="600">Spine</text>
    <line class="lead" x1="328" y1="642" x2="156" y2="645"/><circle class="pt" cx="328" cy="642" r="4.5"/><text class="lbl l" x="150" y="650">Bladder</text>
    <line class="lead" x1="295" y1="760" x2="156" y2="760"/><circle class="pt" cx="295" cy="760" r="4.5"/><text class="lbl l" x="150" y="765">Lower back</text>
  </g>
  <!-- right foot points, labelled on the right -->
  <g>
    <line class="lead" x1="632" y1="185" x2="744" y2="165"/><circle class="pt" cx="632" cy="185" r="4.5"/><text class="lbl" x="750" y="170">Sinuses</text>
    <line class="lead" x1="598" y1="290" x2="744" y2="262"/><circle class="pt" cx="598" cy="290" r="4.5"/><text class="lbl" x="750" y="267">Eyes</text>
    <line class="lead" x1="658" y1="298" x2="744" y2="292"/><circle class="pt" cx="658" cy="298" r="4.5"/><text class="lbl" x="750" y="297">Ears</text>
    <line class="lead" x1="690" y1="335" x2="744" y2="322"/><circle class="pt" cx="690" cy="335" r="4.5"/><text class="lbl" x="750" y="327">Shoulder</text>
    <line class="lead" x1="610" y1="352" x2="744" y2="355"/><circle class="pt" cx="610" cy="352" r="4.5"/><text class="lbl" x="750" y="360">Lungs</text>
    <line class="lead" x1="635" y1="445" x2="744" y2="430"/><circle class="pt" cx="635" cy="445" r="4.5"/><text class="lbl" x="750" y="435">Liver</text>
    <line class="lead" x1="660" y1="488" x2="744" y2="465"/><circle class="pt" cx="660" cy="488" r="4.5"/><text class="lbl" x="750" y="470">Gallbladder</text>
    <line class="lead" x1="588" y1="510" x2="744" y2="500"/><circle class="pt" cx="588" cy="510" r="4.5"/><text class="lbl" x="750" y="505">Kidney</text>
    <line class="lead" x1="602" y1="585" x2="744" y2="575"/><circle class="pt" cx="602" cy="585" r="4.5"/><text class="lbl" x="750" y="580">Small intestine</text>
    <line class="lead" x1="662" y1="612" x2="744" y2="610"/><circle class="pt" cx="662" cy="612" r="4.5"/><text class="lbl" x="750" y="615">Large intestine</text>
    <line class="lead" x1="605" y1="722" x2="744" y2="722"/><circle class="pt" cx="605" cy="722" r="4.5"/><text class="lbl" x="750" y="727">Sciatic nerve</text>
  </g>

  <text class="foot" x="292" y="880">LEFT FOOT</text>
  <text class="foot" x="608" y="880">RIGHT FOOT</text>
  <text class="note" x="450" y="916">The zones are reflexology's traditional map, not medical evidence · spabalimoon.com</text>
</svg>
